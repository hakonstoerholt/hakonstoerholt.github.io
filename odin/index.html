<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin | Håkon J. Størholt</title>
    <meta name="description" content="Odin — a keyboard-driven market terminal, built from scratch. A short film of the real app.">
    <meta name="author" content="Håkon Julius Størholt">
    <meta name="theme-color" content="#0b0e13">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hassium.no/odin/">
    <meta property="og:title" content="Odin | Håkon J. Størholt">
    <meta property="og:description" content="A keyboard-driven market terminal, built from scratch.">
    <meta property="og:image" content="https://hassium.no/odin/media/film.jpg">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* The page is the film's own backdrop: one flat navy (#0b0e13, the film's FILM_BG,
           and the video is tagged sRGB so browsers show it as they show CSS), so the film has
           no frame and simply sits in the room. Always dark, in both site themes; the site's
           tokens are re-pointed here so the header and footer follow. */
        body.odin-page {
            --odin-bg: #0b0e13;
            --odin-header: 61px;
            --odin-chrome: 196px;
            --white: #0d1117;
            --off-white: #0d1117;
            --light-grey: #131922;
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.14);
            --text-primary: #ece6dd;
            --text-secondary: #a9adb4;
            --text-muted: #6f747c;
            --accent: #e0915a;
            background: var(--odin-bg);
            color: var(--text-primary);
        }
        body.odin-page .header {
            background: rgba(11, 14, 19, 0.82);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        body.odin-page #theme-toggle { display: none; }
        body.odin-page .footer {
            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        body.odin-page .footer p { color: #555b63; }

        .odin-stage {
            min-height: 100vh;
            min-height: 100svh;
            padding: calc(var(--odin-header) + 28px) 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            text-align: center;
        }
        .odin-kicker {
            font: 600 0.75rem/1 'JetBrains Mono', monospace;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #e0915a;
        }
        .odin-title {
            font: 600 clamp(2rem, 3.4vw, 2.9rem)/1.05 'Cormorant Garamond', serif;
            color: #f2ece4;
            margin: 0.7rem 0 0.55rem;
            letter-spacing: -0.005em;
        }
        .odin-sub {
            font: 400 1rem/1.5 'Inter Tight', sans-serif;
            color: #a3a9b1;
        }

        /* The film: no border, no shadow; a light feather hides encoder noise at the edge. */
        .odin-screen {
            position: relative;
            width: min(100%, 1760px, calc((100vh - var(--odin-header) - var(--odin-chrome)) * 16 / 9));
            width: min(100%, 1760px, calc((100svh - var(--odin-header) - var(--odin-chrome)) * 16 / 9));
            aspect-ratio: 16 / 9;
            -webkit-mask-image:
                linear-gradient(to right, transparent 0, #000 2.5%, #000 97.5%, transparent 100%),
                linear-gradient(to bottom, transparent 0, #000 3%, #000 97%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                linear-gradient(to right, transparent 0, #000 2.5%, #000 97.5%, transparent 100%),
                linear-gradient(to bottom, transparent 0, #000 3%, #000 97%, transparent 100%);
            mask-composite: intersect;
        }
        .odin-screen video { width: 100%; height: 100%; display: block; object-fit: cover; cursor: pointer; }

        /* Minimal controls: appear on hover or focus, sit inside the unfeathered area. */
        .odin-controls {
            position: absolute;
            right: 6%;
            bottom: 8%;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .odin-screen:hover .odin-controls, .odin-controls:focus-within { opacity: 1; }
        .odin-controls button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(8, 11, 15, 0.72);
            color: #ece6dd;
            cursor: pointer;
            font-size: 0.8rem;
            backdrop-filter: blur(6px);
        }
        .odin-controls button:hover { border-color: rgba(224, 145, 90, 0.7); color: #fff; }
        @media (hover: none) { .odin-controls { opacity: 1; } }

        @media (max-width: 700px) {
            .odin-stage { padding: calc(var(--odin-header) + 28px) 12px 32px; gap: 22px; }
            .odin-screen { width: 100%; }
            .odin-controls { right: 7%; bottom: 10%; }
            .odin-controls button { width: 32px; height: 32px; }
        }
    </style>
</head>
<body class="odin-page">
    <div class="scroll-progress" id="scroll-progress"></div>

    <header class="header">
        <div class="nav-container">
            <a href="/" class="logo"><img src="/images/hjs-symbol.svg" alt="" class="logo-icon"><span class="logo-text">Håkon J. Størholt</span></a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="/#education" class="nav-link">Education</a></li>
                    <li><a href="/#projects" class="nav-link">Projects</a></li>
                    <li><a href="/#skills" class="nav-link">Skills</a></li>
                    <li><a href="/#experience" class="nav-link">Experience</a></li>
                    <li><a href="/odin/" class="nav-link active">Odin</a></li>
                    <li><a href="/cassandra/" class="nav-link">Cassandra</a></li>
                    <li><a href="/sisyphus/" class="nav-link">Sisyphus</a></li>
                    <li><a href="/f1/" class="nav-link">F1</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button class="nav-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode"><i class="fas fa-moon"></i></button>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="odin-stage">
        <div>
            <div class="odin-kicker">Odin</div>
            <h1 class="odin-title">A market terminal, built from scratch</h1>
            <p class="odin-sub">Keyboard-driven. Markets, regimes, research and an AI analyst on one screen.</p>
        </div>
        <div class="odin-screen">
            <video id="film" src="media/film.mp4" poster="media/film.jpg" muted loop playsinline preload="metadata"
                   aria-label="Odin — a short film of the terminal"></video>
            <div class="odin-controls">
                <button id="film-play" aria-label="Pause"><i class="fas fa-pause"></i></button>
                <button id="film-full" aria-label="Full screen"><i class="fas fa-expand"></i></button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="https://github.com/hakonstoerholt" class="footer-link" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/hakonstoerholt" class="footer-link" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:hakonstoerholt@gmail.com" class="footer-link" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>
            <p>&copy; 2026 Håkon Julius Størholt</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Keep the visitor's site theme for the other pages; this one is always dark.
            const savedTheme = localStorage.getItem('hjs-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);

            const toggle = document.querySelector('.mobile-menu-toggle');
            const menu = document.querySelector('.nav-menu');
            if (toggle) toggle.addEventListener('click', () => menu.classList.toggle('active'));

            const progress = document.getElementById('scroll-progress');
            window.addEventListener('scroll', () => {
                const h = document.documentElement;
                const max = h.scrollHeight - h.clientHeight;
                progress.style.width = (max > 0 ? h.scrollTop / max * 100 : 0) + '%';
            });

            const film = document.getElementById('film');
            const playBtn = document.getElementById('film-play');
            const setIcon = () => {
                playBtn.innerHTML = film.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                playBtn.setAttribute('aria-label', film.paused ? 'Play' : 'Pause');
            };
            const togglePlay = () => (film.paused ? film.play() : film.pause());
            film.addEventListener('play', setIcon);
            film.addEventListener('pause', setIcon);
            film.addEventListener('click', togglePlay);
            playBtn.addEventListener('click', togglePlay);
            document.getElementById('film-full').addEventListener('click', () => {
                if (film.requestFullscreen) film.requestFullscreen();
                else if (film.webkitEnterFullscreen) film.webkitEnterFullscreen();
            });

            // The film plays muted on its own, unless the visitor asks for less motion.
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                film.play().catch(() => {});
            }
            setIcon();
        });
    </script>
</body>
</html>
