<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Hassium element symbol">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a1e"/>
      <stop offset="100%" stop-color="#4a3424"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a15b34"/>
      <stop offset="100%" stop-color="#7f3f25"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <!-- Card body -->
  <rect x="56" y="56" width="400" height="400" rx="24" ry="24" fill="url(#cardGrad)"/>

  <!-- Border accent -->
  <rect x="56" y="56" width="400" height="400" rx="24" ry="24" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Atomic number -->
  <text
    x="96"
    y="120"
    fill="#bda792"
    font-family="'Space Grotesk', 'Inter', Arial, sans-serif"
    font-size="36"
    font-weight="500"
    letter-spacing="1"
  >108</text>

  <!-- Element symbol -->
  <text
    x="256"
    y="290"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#FBF7F0"
    font-family="'Space Grotesk', 'Inter', Arial, sans-serif"
    font-size="180"
    font-weight="700"
    letter-spacing="-4"
  >Hs</text>

  <!-- Element name -->
  <text
    x="256"
    y="382"
    text-anchor="middle"
    fill="#9a8674"
    font-family="'Inter', Arial, sans-serif"
    font-size="28"
    font-weight="400"
    letter-spacing="6"
    text-transform="uppercase"
  >HASSIUM</text>

  <!-- Subtle corner accent -->
  <line x1="376" y1="96" x2="416" y2="96" stroke="#a15b34" stroke-width="2" opacity="0.4"/>
  <line x1="416" y1="96" x2="416" y2="136" stroke="#a15b34" stroke-width="2" opacity="0.4"/>
</svg>
